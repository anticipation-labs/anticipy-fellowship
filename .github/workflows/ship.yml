# Cloudflare Builds deploys `main` from this repository. This workflow is the
# independent proof that the commit parses, passes its local behavioral tests,
# reaches the Worker, and is then visible through the public domain.
name: ship

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ship
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install pinned local tooling
        run: npm ci

      - name: Run local syntax and behavioral checks
        run: npm run check

      - name: Validate the Cloudflare deployment configuration
        run: npm run deploy:cloudflare:dry-run

      - name: Byte-verify the Cloudflare Worker
        run: |
          set -euo pipefail
          ORIGIN="https://anticipy-fellowships.omar-114.workers.dev"
          echo "Waiting for Cloudflare Builds to serve this commit's bytes"
          for attempt in $(seq 1 60); do
            MATCH=yes
            for path in fellowships.html assets/favicon.png assets/prototype-bench.jpg; do
              if ! curl -fsS --max-time 20 "$ORIGIN/$path" -o "/tmp/$(basename "$path")" 2>/dev/null ||
                 ! cmp -s "/tmp/$(basename "$path")" "pb_public/$path"; then
                MATCH=no
                break
              fi
            done
            if [ "$MATCH" = yes ]; then
              echo "MATCH after $((attempt * 10))s — Cloudflare serves this commit exactly"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Cloudflare did not serve this commit's page and assets within ten minutes."
          echo "::error::Check the anticipy-fellowships Worker build; do not assume this shipped."
          exit 1

      - name: Byte-verify the public domain
        run: |
          set -euo pipefail
          ORIGIN="https://anticipyfellowship.com"
          echo "Waiting for the Cloudflare domain routes to serve this release"
          for attempt in $(seq 1 60); do
            MATCH=yes
            for path in fellowships.html assets/favicon.png assets/prototype-bench.jpg; do
              if ! curl -fsS --max-time 20 "$ORIGIN/$path" -o "/tmp/public-$(basename "$path")" 2>/dev/null ||
                 ! cmp -s "/tmp/public-$(basename "$path")" "pb_public/$path"; then
                MATCH=no
                break
              fi
            done
            if [ "$MATCH" = yes ]; then
              echo "MATCH after $((attempt * 10))s — the public site serves this commit exactly"
              exit 0
            fi
            sleep 10
          done
          echo "::error::The Worker is current, but anticipyfellowship.com did not match within ten minutes."
          echo "::error::Check the Cloudflare zone, Worker routes, and Universal SSL status."
          exit 1

      - name: Record the verified release
        run: |
          echo "### Shipped :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare and https://anticipyfellowship.com were verified byte-for-byte against \`${GITHUB_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
